name: Deploy to GitHub Pages

# gh-pages 브랜치에 빌드 결과를 푸시하는 방식.
# (actions/deploy-pages 방식은 Pages 사전 활성화 권한이 필요해 gh-pages 브랜치 방식 사용)
on:
  push:
    branches:
      - main
      - claude/japanese-voice-interpreter-n87wru
    paths:
      - "japanese-interpreter/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: japanese-interpreter/package-lock.json
      - name: Install dependencies
        working-directory: japanese-interpreter
        run: npm ci
      - name: Run tests
        working-directory: japanese-interpreter
        run: npm test
      - name: Build
        working-directory: japanese-interpreter
        run: npm run build
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: japanese-interpreter/dist
