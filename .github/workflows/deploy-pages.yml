name: Deploy to GitHub Pages

# gh-pages 브랜치에 빌드 결과를 푸시하는 방식.
# (actions/deploy-pages 방식은 Pages 사전 활성화 권한이 필요해 gh-pages 브랜치 방식 사용)
on:
  push:
    branches:
      - main
      - claude/japanese-voice-interpreter-n87wru
    paths:
      - "japanese-interpreter/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: japanese-interpreter/package-lock.json
      - name: Install dependencies
        working-directory: japanese-interpreter
        run: npm ci
      - name: Run tests
        working-directory: japanese-interpreter
        run: npm test
      - name: Build
        working-directory: japanese-interpreter
        # 공용 프록시 내장: 저장소 Settings → Actions Variables에
        # ZENJI_PROXY_URL / ZENJI_PROXY_PASSWORD 를 설정하면 방문자는 설정 없이 사용 가능.
        # (Anthropic API 키는 절대 여기 넣지 말 것 — 프록시 주소·공용 비밀번호만)
        env:
          VITE_PROXY_URL: ${{ vars.ZENJI_PROXY_URL }}
          VITE_PROXY_PASSWORD: ${{ vars.ZENJI_PROXY_PASSWORD }}
        run: npm run build
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: japanese-interpreter/dist
