name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/japanese-voice-interpreter-n87wru
    paths:
      - "japanese-interpreter/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: japanese-interpreter/package-lock.json
      - name: Install dependencies
        working-directory: japanese-interpreter
        run: npm ci
      - name: Run tests
        working-directory: japanese-interpreter
        run: npm test
      - name: Build
        working-directory: japanese-interpreter
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: japanese-interpreter/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
